# Merino Court, 152-154 Lever Street, London EC1V 8BG: the building file.
#
# The source of truth for every building-specific decision about Merino Court. `make build BUILDING=merino-court`
# rebuilds every output from it (backend/scripts/block/build.py) and runs the checks (qa/report.md).
#
# The source is the developer's sales brochure, MerinoCourt.pdf: ten photographed pages, with a key plan of every
# floor and a plan of every unit with its gross area. There are no lease plans, so this building has its own frame;
# frames and north rules from other buildings do not apply here.
#
#   Pages     the brochure's pages as numbered in the PDF (1-10), read at their native resolution (pdfimages: about
#             1800 x 2500 px a page). Every `box` and `seed` is in that page's native pixels (x right, y down).
#   Sheet     the First Floor key plan on page 8 is the sheet: the building's frame, in page-8 pixels. Every other key
#             plan is registered onto it by its site outline (trace.py). 1 m is about 8.1 sheet px.
#   North     north is NOT up the page. The brochure's compass rose points north to the left of the page; the fit to
#             the OpenStreetMap footprint (georeference) puts up the page at about 80.5 deg true (east by north):
#             the main block runs along Lever Street, its chamfered corner at Bath Street. "Up the page" is called
#             page-up here, never north.
#   Levels    physical storeys, not the brochure's names: -1 lower ground ... 5 fourth floor (levels). The mews houses'
#             upper floor is drawn on the First Floor key plan but stands at level 1 (see levels).
#
# Generated from it, never edited by hand: trace.json (the key-plan cells and plan outlines), the model, the register,
# the plan drawings (frontend/public/merino-court/plans/*.svg), ifc/ and qa/report.*.
# Still in code: the tracer's colour thresholds (block/trace.py) and the book's prose (frontend/src/app/merino-court).
version: 1
pipeline: brochure
building:
  id: merino-court
  name: Merino Court
  address: 152-154 Lever Street, London EC1V 8BG
  area: Clerkenwell / Old Street, London EC1V
  units: 22
  source:
    pdf: MerinoCourt.pdf   # in the repo folder, git-ignored (45 MB of photographs); MERINO_PDF=<path> overrides
    what: the developer's sales brochure, photographed (10 pages); the plans are reference only, the book shows redrawn plans
  streets: {Lever Street: page-right (south), Bath Street: page-up (east)}

# ---- levels: physical storeys -------------------------------------------------------------------------------------
# Evidence (EA LiDAR 1 m composite, 2022, fetched by block/lidar.py): the main block's roof is flat at 18.1 m above
# Lever Street (median over the whole roof), i.e. six 3.0 m storeys above the street (ground, mezzanine, 1st-4th);
# the brochure adds a lower ground floor under the pavement ("Pavement Lights Above" on LW1/LW2's plans). H1's roof
# reads 14.4 m: H1 is on the mezzanine to the 3rd floor, as the key plans show, with nothing on the 4th. The mews
# band north of the garden reads 3.5-7 m: two storeys, so their upper floor stands at level 1 (3.0 m) although the
# brochure draws it on its First Floor key plan.
levels:
- {id: -1, name: Lower ground floor, short: LG, ffl: -3.0, height: 3.0}
- {id: 0, name: Ground floor, short: G, ffl: 0.0, height: 3.0}
- {id: 1, name: Mezzanine floor, short: M, ffl: 3.0, height: 3.0}
- {id: 2, name: First floor, short: '1', ffl: 6.0, height: 3.0}
- {id: 3, name: Second floor, short: '2', ffl: 9.0, height: 3.0}
- {id: 4, name: Third floor, short: '3', ffl: 12.0, height: 3.0}
- {id: 5, name: Fourth floor, short: '4', ffl: 15.0, height: 3.0}

# ---- key plans: one per floor, registered onto the sheet ----------------------------------------------------------
key_plans:
  lower_ground: {page: 10, box: [1330, 80, 1545, 450], title: Lower Ground Floor}
  ground: {page: 10, box: [1550, 80, 1790, 450], title: Ground Floor}
  mezzanine: {page: 8, box: [840, 55, 1060, 430], title: Mezzanine Floor}
  first: {page: 8, box: [1065, 55, 1285, 430], title: First Floor, sheet: true}
  second: {page: 8, box: [1285, 55, 1500, 430], title: Second Floor}
  third: {page: 8, box: [1500, 55, 1720, 430], title: Third Floor}
  fourth: {page: 4, box: [2160, 80, 2420, 445], title: Fourth Floor}

# ---- georeference: sheet px -> the ground ---------------------------------------------------------------------------
# The main block's outline on the sheet (read at the centre of the key plan's outline, +/-1 px), matched corner for
# corner to OpenStreetMap's footprint of Merino Court (way 154856452, "152-154 Lever Street", ODbL). A similarity
# (scale, rotation, shift), least squares; the checks report each corner's residual. 2026-11-09: 0.45 m rms,
# 8.14 px/m, page-up at 80.5 deg true. The LiDAR is the independent check (its roof edge against this outline).
georeference:
  origin: [-0.0918, 51.5278]   # lng, lat of the local metres' origin (x east, y north)
  control:
  - {what: 'wing, page-up left corner (Bath St end, north face)', px: [1187.5, 74.5], osm_node: 0, lnglat: [-0.0915956, 51.5278738]}
  - {what: 'wing, page-up face meets the chamfer', px: [1256, 76], osm_node: 1, lnglat: [-0.0915727, 51.5277955]}
  - {what: 'wing, chamfer meets the Lever St face', px: [1265.5, 89.5], osm_node: 2, lnglat: [-0.0915868, 51.5277821]}
  - {what: 'wing, Lever St face, page-down end', px: [1266.5, 394.6], osm_node: 4, lnglat: [-0.09212, 51.5277319]}
  - {what: 'wing, page-down end, garden side (H1)', px: [1200, 402], osm_node: 5, lnglat: [-0.0921622, 51.5277996]}
  - {what: 'wing, garden face, step at H1 (outer)', px: [1200, 355.5], osm_node: 6, lnglat: [-0.0920825, 51.5278076]}
  - {what: 'wing, garden face, step at H1 (inner)', px: [1187.5, 354.5], osm_node: 7, lnglat: [-0.0920825, 51.5278163]}

# The main block's outline on the sheet (the same corners), for the common parts: on each floor of the block, what the
# key plan leaves outside the units is the block's core (stairs, lift, lobby, lightwell) where the LiDAR shows the
# storey built, and nothing where it does not.
wing: [[1187.5, 74.5], [1256, 76], [1265.5, 89.5], [1266.5, 394.6], [1200, 402], [1200, 355.5], [1187.5, 354.5]]

# ---- the brochure's drawings: one entry per plan drawing (page px) ------------------------------------------------
# A plan's outline is traced at the outer face of its external walls (trace.py). Options, where the tracer needs help:
#   contrast lines darker than their neighbourhood by this (0-255 mean RGB) count as the drawing's lines (default 25)
#   close    pixels of closing before the fill, to bridge window openings (default 2)
#   exclude  page-px boxes cut out of the outline (a terrace or deck outside the walls)
#   seal     page-px lines drawn across an opening too wide to close (French doors) before the fill
#   void     page-px boxes of a double-height space drawn on an upper floor: drawn, but not counted or fitted
# Scale: a unit's plans are scaled together so that their area inside the external walls equals the unit's gross area
# (the UK convention for "gross internal area"; the checks test it against the block's depth and the key plan).
plans:
  MZ1/F1/F5: {page: 2, box: [750, 640, 1500, 1490]}
  MZ2/F2/F6: {page: 2, box: [60, 640, 530, 1300]}
  # its entrance stands open (300, 1000-1070): unsealed, the outline ran in through it and left the bathroom out
  MZ3/F3/F7: {page: 1, box: [80, 690, 820, 1450], seal: [[[300, 1000], [300, 1070]]]}
  MZ4/F4/F8: {page: 1, box: [890, 700, 1750, 1770]}
  F9 lower: {page: 3, box: [710, 1240, 1460, 2020]}
  F9 upper: {page: 3, box: [720, 460, 1450, 1220]}
  F10 lower: {page: 3, box: [50, 1180, 690, 1810]}
  F10 upper: {page: 3, box: [50, 550, 610, 1170]}
  F11 lower: {page: 4, box: [750, 1230, 1390, 1850]}
  # the WC's end wall is open for its window (805, 838-898): unsealed, the outline left the WC out
  F11 upper: {page: 4, box: [750, 580, 1370, 1210], seal: [[[805, 838], [805, 898]]]}
  F12 lower: {page: 4, box: [1430, 1220, 2190, 2040]}
  F12 upper: {page: 4, box: [1410, 470, 1970, 1210]}
  M1 ground: {page: 6, box: [90, 1330, 730, 2020]}
  # as M2 upper: its French doors open outwards onto a Juliet balcony (east wall, 903-1050), outside the walls
  M1 upper: {page: 6, box: [80, 670, 750, 1350], seal: [[[664, 903], [664, 1050]]], exclude: [[668, 880, 760, 1070]]}
  M2 ground: {page: 5, box: [710, 1230, 1320, 1800]}
  # its French doors leave the east wall open for 140 px; their leaves open outwards (cut off)
  M2 upper: {page: 5, box: [710, 600, 1330, 1160], seal: [[[1266, 790], [1266, 965]]], exclude: [[1270, 780, 1330, 990]]}
  M3 ground: {page: 5, box: [50, 1220, 650, 1740]}
  # the void over M3's living room, open to the ground floor: the key plan's First Floor leaves it out of M3
  M3 upper: {page: 5, box: [50, 600, 690, 1110], void: [[50, 600, 690, 850]], seal: [[[607, 912], [607, 980]]], exclude: [[611, 840, 690, 995]]}
  # the raised deck (west of the wall at x 250) and its steps are outside: H1's gross area is inside its walls
  H1 ground: {page: 7, box: [70, 1160, 1070, 1900], exclude: [[40, 1150, 249, 1910]]}
  H1 first: {page: 7, box: [820, 650, 1630, 1200]}
  H1 second: {page: 8, box: [50, 1310, 830, 1880]}
  H1 third: {page: 8, box: [810, 650, 1490, 1190]}
  LW1 lower ground: {page: 9, box: [60, 600, 800, 1790], close: 6}
  LW1 ground: {page: 9, box: [870, 760, 1640, 1670]}
  LW2 lower ground: {page: 10, box: [60, 610, 860, 1930]}
  LW2 ground: {page: 10, box: [920, 660, 1680, 1910]}

# ---- what each plan drawing shows beside its walls (planread.py), for the redrawn floor plans ----------------------
# rooms     [name, x, y] or [name, x, y, mark]: a room's name and a point in it (page px). The names are the brochure's
#           own, at the middle of its printed words (OCR, checked by eye on 2026-11-09). Marks:
#             unnamed  the brochure draws the room but prints no name: named here for what it draws
#             outdoor  a terrace, balcony or deck inside the plan's outline (drawn as outdoor space; no size)
#             note     words at a point, not a room (a tea point in an open floor)
#           A room's size is measured from the drawing (the brochure prints none).
# entrance  [x, y, way]: where you walk in, on the wall's line, and the way you walk (up/down/left/right on the page);
#           on the floor a home is entered at
# fittings  [x, y] points on the drawing's lines to redraw as they are: a stair, a tea point's units
# no_door   [x, y] hinges of doors the reading finds that are not doors
# glazing   [x0, y0, x1, y1] lines to draw as windows: French doors whose leaves the page cuts off (the plans' `seal`)
